[package]
name = "djtools"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native Engine DJ, Rekordbox XML and Serato collection interchange"

[dependencies]
engine-library = { git = "https://github.com/alexgorbatchev/engine-cli-rust.git", rev = "ffe3fa7812b4b9cd73b1d661062e621c7adfead4" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
lofty = "0.25"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

